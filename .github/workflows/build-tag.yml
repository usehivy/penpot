name: _TAG

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-bundle:
    # Hivy release images are built by hivy-release-images.yml. The upstream
    # tag workflow depends on Kaleidos S3/runner secrets that this fork should
    # not require for releases.
    if: ${{ github.repository_owner != 'usehivy' }}
    uses: ./.github/workflows/build-bundle.yml
    secrets: inherit
    with:
      gh_ref: ${{ github.ref_name }}
      build_wasm: "yes"
      build_storybook: "yes"

  build-docker:
    if: ${{ github.repository_owner != 'usehivy' }}
    needs: build-bundle
    uses: ./.github/workflows/build-docker.yml
    secrets: inherit
    with:
      gh_ref: ${{ github.ref_name }}

  notify:
    if: ${{ github.repository_owner != 'usehivy' }}
    name: Notifications
    runs-on: ubuntu-24.04
    needs: build-docker

    steps:
      - name: Notify Mattermost
        uses: mattermost/action-mattermost-notify@master
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK }}
          MATTERMOST_CHANNEL: bot-alerts-cicd
          TEXT: |
            🐳 *[PENPOT] Docker image available: ${{ github.ref_name }}*
            🔗 Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            @infra

  publish-final-tag:
    if: ${{ github.repository_owner != 'usehivy' && !contains(github.ref_name, '-RC') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta')  && contains(github.ref_name, '.') }}
    needs: build-docker
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      gh_ref: ${{ github.ref_name }}
